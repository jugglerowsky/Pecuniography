<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pecuniography</title>
    <!--
      Applies the theme before the page is drawn, so there is no white flash
      in dark mode. Saved choice first; otherwise the operating system's.
      The key must match THEME_STORAGE_KEY in src/utils/theme.ts.
    -->
    <script>
      (function () {
        var saved = null
        try {
          saved = localStorage.getItem('pecuniography-theme')
        } catch (e) {}
        var dark = saved === 'dark' || saved === 'light'
          ? saved === 'dark'
          : window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.classList.toggle('dark', dark)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
